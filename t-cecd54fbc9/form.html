<!doctype html><html lang="ja"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料見積もりフォーム</title></head><body style="margin:0;font-family:'Hiragino Sans',sans-serif;background:#f4f6fb;color:#1f2633"><div style="background:#fff8d6;border-bottom:1px solid #ecd77a;padding:10px 16px;font-size:13px">ご確認用のページです。本番の受付につながっているので、送信すると実際のスプレッドシートに記録され、LINEとメールに通知が届き、LINEの友だち追加ページへ移動します。お名前は「テスト」でお試しください（確認後、テストの記録はこちらで削除します）。</div><div style="max-width:520px;margin:0 auto;padding:20px 16px 60px"><!-- ===== &#x7533;&#x8fbc;&#x30d5;&#x30a9;&#x30fc;&#x30e0;&#xff08;&#x30d5;&#x30a9;&#x30fc;&#x30e0;&#x30da;&#x30fc;&#x30b8;&#x7528;&#xff09;&#x3053;&#x3053;&#x304b;&#x3089;&#x3002;&#x3053;&#x306e;&#x67a0;&#x306e;&#x4e2d;&#x3092;&#x4e38;&#x3054;&#x3068;&#x3001;WordPress&#x306e;&#x300c;&#x30ab;&#x30b9;&#x30bf;&#x30e0;HTML&#x300d;&#x30d6;&#x30ed;&#x30c3;&#x30af;&#x306b;&#x8cbc;&#x3063;&#x3066;&#x304f;&#x3060;&#x3055;&#x3044; ===== -->
<div class="nf-form" data-form="" data-source="LP&#x30fb;&#x30d5;&#x30a9;&#x30fc;&#x30e0;&#x30da;&#x30fc;&#x30b8;" data-heading="show" style="max-width:480px;margin:0 auto;min-height:320px"></div>
<script>
(function () {
  // ===== \u8a2d\u5b9a\uff08\u901a\u5e38\u306f\u5909\u66f4\u4e0d\u8981\u3002\u9805\u76ee\u3084\u6587\u8a00\u306f\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u306e\u300c\u8a2d\u5b9a\u300d\u30bf\u30d6\u3067\u5909\u3048\u307e\u3059\uff09 =====
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyiCyMXELJiWvw6zu3S6FaaRyNtgBNFAOyg8YFxJu2of3eDH6KnB7lFteMSSyqUlYs9/exec';
  var TIMEOUT_MS = 20000;
  // \u8a2d\u5b9a\u30bf\u30d6\u3092\u8aad\u307f\u8fbc\u3080\u307e\u3067\u306e\u9593\u306b\u51fa\u3059\u4e2d\u8eab\uff08\u8aad\u307f\u8fbc\u3081\u306a\u304b\u3063\u305f\u3068\u304d\u3082\u3053\u308c\u3067\u53d7\u3051\u4ed8\u3051\u308b\uff09
  var DEFAULT_CONFIG = {"title":"\u907a\u54c1\u6574\u7406\u306e\u7121\u6599\u898b\u7a4d\u3082\u308a\u30d5\u30a9\u30fc\u30e0","image":"","description":"\u300e\u304a\u540d\u524d\u300f\u3068\u300e\u96fb\u8a71\u756a\u53f7\u300f\u3092\u5165\u529b\u3059\u308b\u3068\u3001\u7121\u6599\u898b\u7a4d\u3082\u308a\u306b\u304a\u9032\u307f\u3044\u305f\u3060\u3051\u307e\u3059\u3002","button":"\u7121\u6599\u898b\u7a4d\u3082\u308a\u306b\u9032\u3080","color":"#5170ff","privacyUrl":"","fields":[{"label":"\u304a\u540d\u524d","type":"name","required":true,"placeholder":"\u4f8b\uff09\u5c71\u7530 \u82b1\u5b50","max":50},{"label":"\u96fb\u8a71\u756a\u53f7","type":"tel","required":true,"placeholder":"\u4f8b\uff09090-1234-5678","max":20}],"imageWait":true,"imageRatio":2.51};
  // ==========================================================================================

  var host = (document.currentScript && document.currentScript.previousElementSibling) || document.querySelector('.nf-form:not([data-ready])');
  if (!host || host.getAttribute('data-ready')) return;
  host.setAttribute('data-ready', '1');
  var SOURCE = host.getAttribute('data-source') || '\u4e0d\u660e';
  var SHOW_HEADING = host.getAttribute('data-heading') !== 'hide';
  var FORM = host.getAttribute('data-form') || ''; // \u8a2d\u5b9a\u30bf\u30d6\u306e\u300c\u30d5\u30a9\u30fc\u30e0\u3054\u3068\u306e\u5217\u300d\u306e\u540d\u524d\u3002\u7a7a\u306a\u3089\u5171\u901a\u306e\u8a2d\u5b9a
  var CACHE_KEY = 'nf-config:' + GAS_URL + '#' + FORM;

  // \u30c6\u30fc\u30de\u306e\u30c7\u30b6\u30a4\u30f3\u306b\u5d29\u3055\u308c\u306a\u3044\u3088\u3046\u3001\u30d5\u30a9\u30fc\u30e0\u3092\u7bb1\uff08Shadow DOM\uff09\u306e\u4e2d\u306b\u9589\u3058\u8fbc\u3081\u308b
  var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
  var touched = false;
  var config = readCache() || DEFAULT_CONFIG;
  var shown = '';

  function start() {
    render(config);
    fetch(GAS_URL + '?config=1' + (FORM ? '&form=' + encodeURIComponent(FORM) : ''), { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok || !res.config || !res.config.fields || !res.config.fields.length) return noImage();
        writeCache(res.config);
        config = res.config;
        if (!touched && JSON.stringify(config) !== shown) render(config); // \u5165\u529b\u304c\u59cb\u307e\u3063\u3066\u3044\u305f\u3089\u7d44\u307f\u76f4\u3055\u306a\u3044
      })
      .catch(noImage);
  }

  // \u7a93\u53e3\u3092\u8aad\u3081\u306a\u304b\u3063\u305f\u3068\u304d\u3001\u753b\u50cf\u3092\u5f85\u3064\u67a0\u3092\u51fa\u3057\u305f\u307e\u307e\u306b\u3057\u306a\u3044\uff08\u898b\u51fa\u3057\u306e\u6587\u5b57\u306b\u623b\u3059\uff09
  function noImage() {
    if (!config.imageWait || touched) return;
    var c = {}; for (var k in config) c[k] = config[k];
    c.imageWait = false;
    render(c);
  }

  function readCache() {
    try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && c.fields && c.fields.length ? c : null; } catch (e) { return null; }
  }
  function writeCache(c) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function safeUrl(u) { return /^https:\/\/[^\s"'<>]+$/.test(u || '') ? u : ''; }
  // \u898b\u51fa\u3057\u753b\u50cf\uff1ahttps \u306e\u753b\u50cf\u304b\u3001\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u306b\u8cbc\u3063\u305f\u753b\u50cf\u306e\u30c7\u30fc\u30bf\uff08data:image/\u2026;base64,\u2026\uff09
  function safeImg(u) { return /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(u || '') ? u : safeUrl(u); }
  function safeColor(c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#5170ff'; }

  // \u30dc\u30bf\u30f3\u306e\u5730\u306e\u8272\uff1a\u30e1\u30a4\u30f3\u30ab\u30e9\u30fc\u3092\u767d\u306b9\u5272\u307e\u305c\u305f\u8584\u3044\u8272
  function soften(hex) {
    return '#' + [1, 3, 5].map(function (i) { var v = parseInt(hex.slice(i, i + 2), 16); return ('0' + Math.round(v * 0.1 + 255 * 0.9).toString(16)).slice(-2); }).join('');
  }
  // \u8aac\u660e\u6587\uff1a\u3010 \u3011\u3067\u56f2\u3093\u3060\u90e8\u5206\u306f\u8d64\u5b57\u30671\u884c\u306b\u3001\u6539\u884c\u306f\u305d\u306e\u307e\u307e\u6539\u884c\u306b
  function descHtml(t) {
    return esc(t).replace(/\n*(\u3010[^\u3011]*\u3011)\n*/g, function (m, x) { return '<span class="em">' + x + '</span>'; }).replace(/\n/g, '<br>');
  }

  // \u898b\u51fa\u3057\uff1a\u30b9\u30da\u30fc\u30b9\uff08\u5168\u89d2\u30fb\u534a\u89d2\uff09\u3067\u533a\u5207\u3063\u305f\u307e\u3068\u307e\u308a\u306e\u9014\u4e2d\u3067\u306f\u6539\u884c\u3057\u306a\u3044\uff08\u300c\u30d5\u30a9\uff0f\u30fc\u30e0\u300d\u306e\u3088\u3046\u306b\u5272\u308c\u306a\u3044\u3088\u3046\u306b\uff09
  function headHtml(t) {
    return String(t).split(/[ \u3000]+/).map(function (w) { return '<span class="w">' + esc(w) + '</span>'; }).join(' ');
  }

  function render(c) {
    shown = JSON.stringify(c);
    var color = safeColor(c.color);
    var fields = c.fields.map(function (f, i) {
      var id = 'f' + i, attrs = ' id="' + id + '" name="' + id + '" maxlength="' + (f.max || 100) + '" placeholder="' + esc(f.placeholder) + '" aria-describedby="' + id + '-err"' + (f.required ? ' aria-required="true"' : '');
      var input;
      if (f.type === 'textarea') input = '<textarea rows="4"' + attrs + '></textarea>';
      else if (f.type === 'tel') input = '<input type="tel" inputmode="tel" autocomplete="tel"' + attrs + '>';
      else if (f.type === 'email') input = '<input type="email" inputmode="email" autocomplete="email"' + attrs + '>';
      else if (f.type === 'name') input = '<input type="text" autocomplete="name"' + attrs + '>';
      else input = '<input type="text"' + attrs + '>';
      var text = /\u304f\u3060\u3055\u3044$/.test(f.label) ? f.label : f.label + '\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044';
      return '<div class="fld"><label for="' + id + '">' + esc(text) + (f.required ? '<span class="req">\uff0a</span>' : '<span class="opt">\uff08\u4efb\u610f\uff09</span>') + '</label>'
        + input
        + '<div class="err" id="' + id + '-err" role="alert"></div></div>';
    }).join('');
    var privacy = safeUrl(c.privacyUrl);
    root.innerHTML = '<style>' + CSS.replace(/__BRAND__/g, color).replace(/__SOFT__/g, soften(color)) + '</style>'
      + '<form novalidate class="' + (SHOW_HEADING && (c.title || c.image) ? 'has-head' : 'no-head') + '">'
      + (SHOW_HEADING && safeImg(c.image) ? '<img class="banner" referrerpolicy="no-referrer" src="' + esc(safeImg(c.image)) + '" alt="' + esc(c.title) + '">' // \u898b\u51fa\u3057\u753b\u50cf\u304c\u3042\u308c\u3070\u5e2f\u306e\u4ee3\u308f\u308a\u306b\u753b\u50cf
        : SHOW_HEADING && c.imageWait ? '<div class="banner wait" aria-hidden="true" style="aspect-ratio:' + (Number(c.imageRatio) > 0.2 && Number(c.imageRatio) < 10 ? Number(c.imageRatio) : 2500 / 1686) + '"></div>' // \u30b7\u30fc\u30c8\u306b\u8cbc\u3063\u305f\u753b\u50cf\u306f\u7a93\u53e3\u304b\u3089\u5c4a\u304f\u307e\u3067\u3001\u540c\u3058\u5927\u304d\u3055\u306e\u67a0\u3092\u7a7a\u3051\u3066\u5f85\u3064\uff08\u30d5\u30a9\u30fc\u30e0\u304c\u4e0b\u306b\u305a\u308c\u306a\u3044\u3088\u3046\u306b\uff09
        : SHOW_HEADING && c.title ? '<div class="head"><h2>' + headHtml(c.title) + '</h2></div>' : '')
      + (SHOW_HEADING && c.description ? '<p class="desc">' + descHtml(c.description) + '</p>' : '')
      + fields
      + '<div class="hp" aria-hidden="true"><label>website<input name="website" tabindex="-1" autocomplete="off"></label></div>'
      + '<button type="submit"><span class="lbl">' + esc(c.button || '\u9001\u4fe1\u3059\u308b') + '</span><span class="arw" aria-hidden="true"></span></button>'
      + '<div class="msg" role="status"></div>'
      + (privacy ? '<p class="privacy">\u9001\u4fe1\u3044\u305f\u3060\u3044\u305f\u5185\u5bb9\u306f<a href="' + esc(privacy) + '" target="_blank" rel="noopener">\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc</a>\u306b\u6cbf\u3063\u3066\u53d6\u308a\u6271\u3044\u307e\u3059\u3002</p>' : '')
      + '</form>';
    var form = root.querySelector('form');
    form.addEventListener('input', function (ev) {
      touched = true;
      var el = ev.target; // \u5165\u529b\u3057\u76f4\u3057\u305f\u3089\u3001\u305d\u306e\u6b04\u306e\u8d64\u5b57\u306f\u305d\u306e\u5834\u3067\u6d88\u3059
      if (el.id && el.getAttribute('aria-invalid') === 'true') {
        el.setAttribute('aria-invalid', 'false');
        var er = form.querySelector('#' + el.id + '-err');
        if (er) er.textContent = '';
      }
    });
    form.addEventListener('submit', function (ev) { ev.preventDefault(); submit(form, c); });
  }

  function toHalf(s) { return String(s).replace(/[\uff10-\uff19\uff21-\uff3a\uff41-\uff5a\uff20\uff0e\uff0d]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); }); }
  function check(f, raw) {
    var v = f.type === 'textarea' ? raw.trim() : raw.replace(/\s+/g, ' ').trim();
    if (!v) return f.required ? f.label + '\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044' : '';
    if (f.type === 'tel' && !/^0\d{9,10}$/.test(toHalf(v).replace(/[^\d]/g, ''))) return '0\u304b\u3089\u59cb\u307e\u308b10\u301c11\u6841\u306e\u756a\u53f7\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044';
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(toHalf(v))) return '\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u306e\u5f62\u3092\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044';
    if (v.length > (f.max || 100)) return (f.max || 100) + '\u6587\u5b57\u4ee5\u5185\u3067\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044';
    return '';
  }
  function showErrors(form, c, errs) {
    var first = null;
    c.fields.forEach(function (f, i) {
      var el = form.querySelector('#f' + i), msg = errs[f.label] || '';
      form.querySelector('#f' + i + '-err').textContent = msg;
      el.setAttribute('aria-invalid', msg ? 'true' : 'false');
      if (msg && !first) first = el;
    });
    if (first) first.focus();
    return !first;
  }

  // \u9001\u4fe1\u5f8c\u306e\u884c\u304d\u5148\uff1a\u8a2d\u5b9a\u30bf\u30d6\u306e\u79fb\u52d5\u5148 \u2192 \u306a\u3051\u308c\u3070\u76f4\u524d\u306e\u30da\u30fc\u30b8\uff08\u540c\u3058\u30b5\u30a4\u30c8\u5185\u3060\u3051\uff09
  function fallbackUrl() {
    try { var u = new URL(document.referrer); if (u.origin === location.origin && u.href !== location.href) return u.href; } catch (e) {}
    return location.origin + '/';
  }
  // \u540c\u3058\u30b5\u30a4\u30c8\u5185\u3078\u623b\u308b\u3068\u304d\u3060\u3051\u300c\u53d7\u3051\u4ed8\u3051\u307e\u3057\u305f\u300d\u306e\u5370\u3092\u4ed8\u3051\u308b\uff08LINE\u306a\u3069\u5916\u90e8\u306eURL\u306b\u306f\u4ed8\u3051\u306a\u3044\uff09
  function withReceived(url) {
    var u = new URL(url, location.href);
    if (u.origin === location.origin) u.searchParams.set('received', '1');
    return u.href;
  }

  function submit(form, c) {
    var btn = form.querySelector('button'), msg = form.querySelector('.msg');
    if (btn.disabled) return;
    msg.textContent = '';
    var values = {}, errs = {};
    c.fields.forEach(function (f, i) {
      var raw = form.querySelector('#f' + i).value;
      values[f.label] = raw;
      var e = check(f, raw);
      if (e) errs[f.label] = e;
    });
    if (!showErrors(form, c, errs)) return;

    var lbl = btn.querySelector('.lbl'), label = lbl.textContent;
    btn.disabled = true; lbl.textContent = '\u9001\u4fe1\u3057\u3066\u3044\u307e\u3059\u2026';
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    var from = new URLSearchParams(location.search).get('from') || '';
    // text/plain \u3067\u9001\u308b\u3068\u4e8b\u524d\u78ba\u8a8d\uff08preflight\uff09\u304c\u8d77\u304d\u305a\u3001GAS\u306e\u8fd4\u4e8b\u3092\u8aad\u3081\u308b
    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ values: values, source: SOURCE, from: from, form: FORM, website: form.website.value }),
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        clearTimeout(timer);
        if (res.ok) {
          if (typeof window.NF_ON_SUCCESS === 'function') { window.NF_ON_SUCCESS(values, SOURCE, form, btn, label); return; } // \u78ba\u8a8d\u7528\u30da\u30fc\u30b8\u3060\u3051\u3067\u4f7f\u3046
          lbl.textContent = '\u30da\u30fc\u30b8\u3092\u79fb\u52d5\u3057\u3066\u3044\u307e\u3059\u2026';
          window.location.replace(withReceived(safeUrl(res.redirect) || fallbackUrl())); // \u623b\u308b\u30dc\u30bf\u30f3\u3067\u30d5\u30a9\u30fc\u30e0\u306b\u623b\u3089\u306a\u3044
          return;
        }
        btn.disabled = false; lbl.textContent = label;
        if (res.error === 'invalid' && res.fields) showErrors(form, c, res.fields);
        else msg.textContent = '\u9001\u4fe1\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002\u304a\u624b\u6570\u3067\u3059\u304c\u3001\u6642\u9593\u3092\u304a\u3044\u3066\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
      })
      .catch(function () {
        clearTimeout(timer);
        btn.disabled = false; lbl.textContent = label;
        msg.textContent = '\u901a\u4fe1\u306b\u5931\u6557\u3057\u307e\u3057\u305f\u3002\u96fb\u6ce2\u306e\u826f\u3044\u5834\u6240\u3067\u3001\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
      });
  }

  // \u898b\u305f\u76ee\u3002\u5148\u65b9\u304c\u3044\u307e\u4f7f\u3063\u3066\u3044\u308b\u30a8\u30eb\u30e1\u306e\u898b\u7a4d\u3082\u308a\u30d5\u30a9\u30fc\u30e0\u306b\u5408\u308f\u305b\u305f\u4f5c\u308a\uff08\u67a0\u306a\u3057\u30fb\u8584\u3044\u7dda\u30fb\u8584\u3044\u8272\u306e\u30dc\u30bf\u30f3\uff09
  var CSS = ''
    + ':host{all:initial;display:block}'
    + 'form{--b:__BRAND__;--soft:__SOFT__;--ink:#333;--line:#cfd3d8;--err:#e0533a;'
    + 'box-sizing:border-box;position:relative;background:#fff;color:var(--ink);padding:0 0 8px;'
    + 'font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",YuGothic,Meiryo,sans-serif;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}'
    + '*{box-sizing:border-box}'
    + '.head{background:var(--b);padding:24px 10px;margin:0 0 26px;text-align:center}'
    + 'h2{margin:0;color:#fff;font-size:clamp(17px,5vw,22px);font-weight:800;line-height:1.45;letter-spacing:0;word-break:auto-phrase}'
    + '.banner{display:block;width:100%;height:auto;margin:0 0 30px}'
    + '.banner.wait{background:#eef1f4}'
    + 'h2 .w{display:inline-block}'
    + '.desc{font-size:16px;margin:0 0 30px;line-height:1.8}'
    + '.em{display:block;margin:.9em 0;color:var(--err);font-weight:700}'
    + '.fld{margin-bottom:26px}'
    + 'label{display:block;font-size:16px;font-weight:700;margin-bottom:10px;letter-spacing:.02em}'
    + '.req{color:var(--err);font-weight:400;margin-left:14px}'
    + '.opt{color:#999;font-size:13px;font-weight:400;margin-left:8px}'
    + 'input,textarea{display:block;width:100%;margin:0;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 12px;-webkit-appearance:none;appearance:none}'
    + 'input{height:44px}textarea{resize:vertical;min-height:110px;line-height:1.6}'
    + 'input::placeholder,textarea::placeholder{color:#b5b9bf}'
    + 'input:focus,textarea:focus{outline:none;border-color:var(--b)}'
    + '[aria-invalid="true"]{border-color:var(--err)!important}'
    + '.err{font-size:13px;color:var(--err);margin-top:6px}.err::before{content:"\u203b"}'
    + '.err:empty{display:none}'
    + '.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}'
    + 'button{display:flex;align-items:center;justify-content:center;gap:10px;width:75%;margin:34px auto 0;min-height:58px;font:inherit;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--b);'
    + 'background:var(--soft);border:0;border-radius:10px;padding:12px 16px;cursor:pointer;-webkit-appearance:none;appearance:none;box-shadow:0 2px 3px rgba(0,0,0,.14)}'
    + '.arw{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor}'
    + 'button:hover{filter:brightness(.98)}'
    + 'button:active{box-shadow:none;transform:translateY(1px)}'
    + 'button:focus-visible{outline:2px solid var(--b);outline-offset:3px}'
    + 'button:disabled{cursor:wait;opacity:.7}button:disabled .arw{display:none}'
    + '.msg{font-size:13px;color:var(--err);margin-top:12px;text-align:center}.msg:empty{display:none}'
    + '.privacy{font-size:12px;color:#777;margin:16px 0 0;text-align:center}.privacy a{color:var(--b)}';

  start();
})();
</script>
